<line x1="12" y1="176" x2="178" y2="176" stroke="#D4D8DC" stroke-opacity=".3"/>
<rect x="12" y="192" width="124" height="4" fill="#D4D8DC" fill-opacity=".28"/>
<rect x="12" y="204" width="84" height="4" fill="#D4D8DC" fill-opacity=".18"/>
<circle class="pulse" style="animation-delay:0.0s" cx="40" cy="138" r="2.6" fill="#D4D8DC"/>
