<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="Agenda: React mastery, freelance UI, SaaS, public app, Linux workflow"><style>.mono{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace}.serif{font-family:Georgia,'Times New Roman',serif}
.rise{opacity:0;transform:translateY(14px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
.d1{animation-delay:.2s}.d2{animation-delay:.45s}.d3{animation-delay:.7s}.d4{animation-delay:.95s}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s ease-out .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.blink{animation:blink 1.2s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.spin{animation:spin 24s linear infinite}
.spin2{animation:spin 9s linear infinite}
.spinr{animation:spinr 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.breathe{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.fill{transform-box:fill-box;transform-origin:left center;animation:fillbar 4s ease-in-out infinite}@keyframes fillbar{0%{transform:scaleX(.1)}60%,85%{transform:scaleX(.7)}100%{transform:scaleX(.1)}}</style><rect width="900" height="290" fill="#0b0b0d"/>
<line x1="40" y1="64" x2="860" y2="64" stroke="#2a2a30"/>
<rect x="40" y="28" width="22" height="22" fill="none" stroke="#7091F0" stroke-width="1.5"/>
<rect class="pulse" x="46" y="34" width="10" height="10" fill="#7091F0"/>
<text class="serif rise d1" x="80" y="48" font-size="24" fill="#f2efe9" font-weight="700">React, mastered properly</text>
<text class="mono" x="860" y="46" font-size="11" letter-spacing="3" fill="#7091F0" text-anchor="end">IN PROGRESS</text>
<rect x="660" y="56" width="200" height="3" fill="#2a2a30"/><rect class="fill" x="660" y="56" width="200" height="3" fill="#7091F0"/>

<line x1="40" y1="116" x2="860" y2="116" stroke="#2a2a30"/>
<rect x="40" y="80" width="22" height="22" fill="none" stroke="#2a2a30" stroke-width="1.5"/>

