<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="900" height="100" role="img" aria-label="Section 05: Agenda"><style>.mono{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace}.serif{font-family:Georgia,'Times New Roman',serif}
.rise{opacity:0;transform:translateY(14px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
.d1{animation-delay:.2s}.d2{animation-delay:.45s}.d3{animation-delay:.7s}.d4{animation-delay:.95s}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s ease-out .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.blink{animation:blink 1.2s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.spin{animation:spin 24s linear infinite}
.spin2{animation:spin 9s linear infinite}
.spinr{animation:spinr 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.breathe{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
</style><rect width="900" height="100" fill="#344B5A"/>
<text class="serif" x="880" y="124" font-size="170" font-weight="700" fill="#fff" fill-opacity=".05" text-anchor="end">05</text>
<text class="mono rise d1" x="40" y="30" font-size="12" letter-spacing="3" fill="#D6A94D">05</text>
<text class="mono rise d1" x="72" y="30" font-size="12" letter-spacing="3" fill="#55555d">/ SECTION</text>
<text class="serif rise d2" x="40" y="80" font-size="46" font-weight="700" fill="#DCE5E9" letter-spacing="-.5">Agenda<tspan fill="#D6A94D">.</tspan></text>
<line x1="40" y1="92" x2="860" y2="92" stroke="#2a2a30"/>
<line class="draw" x1="40" y1="92" x2="150" y2="92" stroke="#D6A94D" stroke-width="2"/>
</svg>