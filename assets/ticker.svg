<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 40" width="900" height="40" role="img" aria-label="React JS / UI-UX / Editorial / Figma / Frontend / GFX"><style>.mono{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace}.serif{font-family:Georgia,'Times New Roman',serif}
.rise{opacity:0;transform:translateY(14px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
.d1{animation-delay:.2s}.d2{animation-delay:.45s}.d3{animation-delay:.7s}.d4{animation-delay:.95s}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s ease-out .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.blink{animation:blink 1.2s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.spin{animation:spin 24s linear infinite}
.spin2{animation:spin 9s linear infinite}
.spinr{animation:spinr 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.breathe{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.t{white-space:pre;font-weight:700}.track{animation:scroll 18s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-580px)}}</style><rect width="900" height="40" fill="#D6A94D"/><g class="track"><text xml:space="preserve" class="mono t" x="0" y="26" font-size="14" fill="#344B5A" textLength="580" lengthAdjust="spacing">REACT JS  /  UI-UX  /  EDITORIAL  /  FIGMA  /  FRONTEND  /  GFX  /  </text><text xml:space="preserve" class="mono t" x="580" y="26" font-size="14" fill="#344B5A" textLength="580" lengthAdjust="spacing">REACT JS  /  UI-UX  /  EDITORIAL  /  FIGMA  /  FRONTEND  /  GFX  /  </text><text xml:space="preserve" class="mono t" x="1160" y="26" font-size="14" fill="#344B5A" textLength="580" lengthAdjust="spacing">REACT JS  /  UI-UX  /  EDITORIAL  /  FIGMA  /  FRONTEND  /  GFX  /  </text></g></svg>