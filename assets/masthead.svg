<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Chelo Arung Samudro: UI/UX, frontend, graphic design">
  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Courier New', monospace; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .rule1 { stroke-dasharray: 820; stroke-dashoffset: 820; animation: draw 1.4s ease-out .2s forwards; }
    .rule2 { stroke-dasharray: 820; stroke-dashoffset: 820; animation: draw 1.4s ease-out 1.1s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; transform: translateY(16px); animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .5s; }
    .d2 { animation-delay: .8s; }
    .d3 { animation-delay: 1.2s; }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    .wipe { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: wipe 3.2s steps(58, end) 1.9s forwards; }
    @keyframes wipe { to { transform: scaleX(1); } }
    .cursor { opacity: 0; animation: move 3.2s steps(58, end) 1.9s forwards, blink .9s step-end 1.9s infinite; }
    @keyframes move { 0% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(560px); opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
  </style>

  <defs>
    <clipPath id="typeclip">
      <rect class="wipe" x="40" y="266" width="560" height="26" />
    </clipPath>
  </defs>

  <rect width="900" height="340" fill="#0b0b0d" />

  <!-- top meta -->
  <text class="mono rise d1" x="40" y="34" font-size="12" letter-spacing="2.5" fill="#8a8a92">VOL. 2026 / PONTIANAK, ID</text>
  <circle class="pulse" cx="676" cy="30" r="4" fill="#7091F0" />
  <text class="mono rise d1" x="860" y="34" font-size="12" letter-spacing="2.5" fill="#8a8a92" text-anchor="end">NOW: REACT JS</text>
  <line class="rule1" x1="40" y1="50" x2="860" y2="50" stroke="#c0392b" stroke-width="2" />

  <!-- name -->
  <text class="serif rise d2" x="40" y="142" font-size="76" font-weight="700" fill="#f2efe9" letter-spacing="-1">CHELO ARUNG</text>
  <text class="serif rise d3" x="40" y="218" font-size="76" font-style="italic" fill="#F4B8CC" letter-spacing="-1">Samudro.</text>

  <!-- ghost watermark -->
  <text class="serif" x="860" y="226" font-size="150" font-weight="700" fill="#ffffff" fill-opacity="0.04" text-anchor="end">01</text>

  <line class="rule2" x1="40" y1="244" x2="860" y2="244" stroke="#2a2a30" stroke-width="1" />

  <!-- typewriter -->
  <g clip-path="url(#typeclip)">
    <text class="mono" x="40" y="285" font-size="16" fill="#7091F0" textLength="560" lengthAdjust="spacing">&gt; loving react. building interfaces that read like pages.</text>
  </g>
  <rect class="cursor" x="40" y="270" width="9" height="18" fill="#F4B8CC" />

  <!-- footer tags -->
  <text class="mono rise d3" x="40" y="322" font-size="11" letter-spacing="3" fill="#55555d">UI/UX  /  FRONTEND  /  GRAPHIC DESIGN</text>
  <text class="mono rise d3" x="860" y="322" font-size="11" letter-spacing="3" fill="#55555d" text-anchor="end">THE ARCHIVE</text>
</svg>
