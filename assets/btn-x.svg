<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" width="200" height="44" role="img" aria-label="X / TWITTER"><style>.mono{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace}.serif{font-family:Georgia,'Times New Roman',serif}
.rise{opacity:0;transform:translateY(14px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
.d1{animation-delay:.2s}.d2{animation-delay:.45s}.d3{animation-delay:.7s}.d4{animation-delay:.95s}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s ease-out .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.blink{animation:blink 1.2s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.spin{animation:spin 24s linear infinite}
.spin2{animation:spin 9s linear infinite}
.spinr{animation:spinr 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.breathe{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.bar{transform-box:fill-box;transform-origin:left center;animation:bar 3s ease-in-out infinite}@keyframes bar{0%{transform:scaleX(0)}45%,70%{transform:scaleX(1)}100%{transform:scaleX(0)}}</style><rect width="200" height="44" fill="#344B5A"/>
<rect x=".5" y=".5" width="199" height="43" fill="none" stroke="#2a2a30"/>
<rect class="bar" x="1" y="40" width="198" height="3" fill="#E5C35F"/>
<text class="mono" x="20" y="27" font-size="12" letter-spacing="3" fill="#D4D8DC">X / TWITTER</text>
<path d="M164 22 H182 M175 15 L182 22 L175 29" fill="none" stroke="#E5C35F" stroke-width="1.8"/>
</svg>